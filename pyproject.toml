[project]
name = "watson"
version = "0.7.0"
description = "Offline-first static & dynamic malware triage orchestrator"
requires-python = ">=3.10"
dependencies = [
    "pefile>=2024.8.26",
    "pyelftools>=0.31",
]

[project.scripts]
watson = "watson.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "yara-python>=4.5",
    "signify>=0.9",
]
yara = [
    "yara-python>=4.5",
]
signify = [
    "signify>=0.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
